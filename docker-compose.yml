services:
  # ── Prism (single Streamlit service) ──────────────────────────────────────
  prism:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Banking's document chat default LLM_PROVIDER=ollama reaches Ollama
      # on the host from inside the container via this DNS name, not localhost.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./vector_store:/app/vector_store    # ChromaDB persists across restarts
      - ./domains/banking/documents/data:/app/domains/banking/documents/data   # reference-corpus ingest + bulk statement output
      - ./domains/banking/fraud/data:/app/domains/banking/fraud/data           # train/holdout CSVs
      - ./domains/insurance/data:/app/domains/insurance/data                   # train/holdout CSVs
      - ./domains/financial_services/data:/app/domains/financial_services/data # train/holdout CSVs
      - ./domains/payroll_hr/data:/app/domains/payroll_hr/data                 # HR handbook reference corpus source
      - ./domains/payroll_hr/hr/data:/app/domains/payroll_hr/hr/data           # train/holdout CSVs
      - ./domains/payroll_hr/payroll/data:/app/domains/payroll_hr/payroll/data # train/holdout CSVs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host Ollama
    restart: unless-stopped
