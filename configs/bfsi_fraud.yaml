# configs/bfsi_fraud.yaml
# Domain: BFSI — Fraud Detection
# Ported from Project A (fraud_detection) — hybrid Rules -> ML -> LLM pipeline.

domain:
  id: bfsi_fraud
  name: "BFSI — Fraud Detection"
  description: >
    Hybrid rule-based + Random Forest + LLM pipeline for transaction fraud
    detection. Rules and the ML fast-path resolve most transactions for
    free; the LLM only reasons over genuinely borderline cases.
  status: working
  input_type: transaction   # CSV rows, manual entry, or receipt/cheque image

pipeline:
  module: domains.bfsi_fraud.pipeline
  class: FraudPipeline

agents:
  - id: detector
    class: domains.bfsi_fraud.agents.detector_agent.FraudDetectorAgent
  - id: analyst
    class: domains.bfsi_fraud.agents.analyst_agent.AnalystAgent
  - id: alert
    class: domains.bfsi_fraud.agents.alert_agent.AlertAgent
  - id: router
    class: domains.bfsi_fraud.agents.routing_agent.RoutingAgent

model:
  name: "${MODEL_NAME:gpt-4o-mini}"

thresholds:
  ml_fraud_score: 0.7
  ml_legit_score: 0.3
  risk_amount: "${RISK_THRESHOLD:50000}"

data:
  demo_csv: domains/bfsi_fraud/data/transactions_balanced.csv

eval:
  harness: domains.bfsi_fraud.eval_harness
  type: classification   # precision / recall / F1 against a labeled holdout

# Used by DomainClassifierAgent to score an uploaded input against this
# domain before a human confirms the guess.
classification_hints:
  keywords:
    - transaction
    - fraud
    - chargeback
    - card
    - amount
    - merchant
    - risk score
    - card verification
    - suspicious activity
    - block
